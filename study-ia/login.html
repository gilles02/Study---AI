<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study-IA - Connexion & Inscription</title>
  <style>
    /* ─────────────────────────────────────────────────────────────────────────
       DESIGN SYSTEM & RESETS
       ───────────────────────────────────────────────────────────────────────── */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f9;
      color: #2c3e50;
      min-height: 100vh;
      display: flex;
    }

    /* Conteneur principal en Split-Screen */
    .page-wrapper {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       CÔTÉ GAUCHE : VISUEL ET ILLUSTRATION (Masqué sur Mobile)
       ───────────────────────────────────────────────────────────────────────── */
    .visual-side {
      flex: 1.2;
      position: relative;
      background: linear-gradient(135deg, rgba(31, 92, 139, 0.9), rgba(15, 46, 70, 0.95)), 
                  url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1200&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      color: #ffffff;
    }

    .visual-content {
      max-width: 500px;
    }

    .visual-side h2 {
      font-size: 42px;
      font-weight: bold;
      line-height: 1.2;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .visual-side p {
      font-size: 18px;
      color: #e2e8f0;
      line-height: 1.6;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       CÔTÉ DROIT : FORMULAIRE DE CONNEXION
       ───────────────────────────────────────────────────────────────────────── */
    .form-side {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background-color: #ffffff;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
    }

    /* Header du formulaire */
    .brand-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .brand-header h1 {
      font-size: 32px;
      color: #1F5C8B;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .brand-header p {
      font-size: 15px;
      color: #718096;
    }

    /* Groupes de champs */
    .form-group {
      width: 100%;
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #4a5568;
      margin-bottom: 10px;
    }

    /* Wrapper moderne du numéro de téléphone (+237) */
    .phone-input-container {
      display: flex;
      align-items: center;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 0 16px;
      background-color: #f8fafc;
      transition: all 0.2s ease;
    }

    .phone-input-container:focus-within {
      border-color: #1F5C8B;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(31, 92, 139, 0.15);
    }

    .country-prefix {
      font-size: 16px;
      color: #1a202c;
      font-weight: bold;
      margin-right: 12px;
      user-select: none;
      border-right: 2px solid #e2e8f0;
      padding-right: 12px;
      height: 24px;
      display: flex;
      align-items: center;
    }

    .phone-input-container input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 16px 0;
      font-size: 16px;
      color: #1a202c;
      outline: none;
      font-weight: 500;
    }

    /* Erreurs de validation */
    .error-container {
      color: #e53e3e;
      font-size: 13px;
      margin-top: 8px;
      display: none;
      font-weight: 500;
    }

    /* Bouton d'action principal */
    .btn-primary {
      width: 100%;
      background-color: #1F5C8B;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 6px -1px rgba(31, 92, 139, 0.2);
    }

    .btn-primary:hover {
      background-color: #164366;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Texte de réassurance inférieur */
    .secure-notice {
      margin-top: 32px;
      text-align: center;
      font-size: 13px;
      color: #a0aec0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       RESPONSIVE DESIGN (MOBILE FIRST)
       ───────────────────────────────────────────────────────────────────────── */
    @media (max-width: 868px) {
      .visual-side {
        display: none; /* Masque la partie illustration sur petits écrans */
      }
      
      .form-side {
        background-color: #f4f7f9; /* Fond légèrement grisé pour faire ressortir la carte */
      }

      .login-card {
        background: #ffffff;
        padding: 32px 24px;
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    
    <div class="visual-side">
      <div class="visual-content">
        <h2>Propulsez vos révisions à un autre niveau.</h2>
        <p>Générez des fiches, des résumés intelligents et des quiz interactifs adaptés à votre niveau grâce à l'intelligence artificielle.</p>
      </div>
    </div>

    <div class="form-side">
      <div class="login-card">
        
        <div class="brand-header">
          <h1>Study-IA</h1>
          <p>Heureux de vous revoir !</p>
        </div>

        <form id="auth-step1">
          <div class="form-group">
            <label for="phone-field">Votre numéro de téléphone</label>
            <div class="phone-input-container">
              <span class="country-prefix">+237</span>
              <input 
                type="tel" 
                id="phone-field" 
                placeholder="67xxxxxxx" 
                maxlength="9"
                autocomplete="tel"
              >
            </div>
            <div id="error-box" class="error-container"></div>
          </div>

          <button type="submit" class="btn-primary">Recevoir mon code</button>
        </form>
        <!-- Formulaire Étape 2 : Saisie de l'OTP (Masqué par défaut) -->
<form id="auth-step2" style="display: none; width: 100%;">
  <div class="form-group">
    <label>Code de vérification SMS</label>
    
    <!-- Les 6 cases pour le code OTP -->
    <div class="otp-container" style="display: flex; gap: 8px; justify-content: space-between; margin-bottom: 15px;">
      <input type="text" class="otp-box" maxlength="1" pattern="\d" inputmode="numeric" style="width: 48px; height: 48px; text-align: center; font-size: 20px; font-weight: bold; border: 2px solid #e2e8f0; border-radius: 8px; background: #f8fafc; outline: none; transition: all 0.2s;" />
      <input type="text" class="otp-box" maxlength="1" pattern="\d" inputmode="numeric" style="width: 48px; height: 48px; text-align: center; font-size: 20px; font-weight: bold; border: 2px solid #e2e8f0; border-radius: 8px; background: #f8fafc; outline: none; transition: all 0.2s;" />
      <input type="text" class="otp-box" maxlength="1" pattern="\d" inputmode="numeric" style="width: 48px; height: 48px; text-align: center; font-size: 20px; font-weight: bold; border: 2px solid #e2e8f0; border-radius: 8px; background: #f8fafc; outline: none; transition: all 0.2s;" />
      <input type="text" class="otp-box" maxlength="1" pattern="\d" inputmode="numeric" style="width: 48px; height: 48px; text-align: center; font-size: 20px; font-weight: bold; border: 2px solid #e2e8f0; border-radius: 8px; background: #f8fafc; outline: none; transition: all 0.2s;" />
      <input type="text" class="otp-box" maxlength="1" pattern="\d" inputmode="numeric" style="width: 48px; height: 48px; text-align: center; font-size: 20px; font-weight: bold; border: 2px solid #e2e8f0; border-radius: 8px; background: #f8fafc; outline: none; transition: all 0.2s;" />
      <input type="text" class="otp-box" maxlength="1" pattern="\d" inputmode="numeric" style="width: 48px; height: 48px; text-align: center; font-size: 20px; font-weight: bold; border: 2px solid #e2e8f0; border-radius: 8px; background: #f8fafc; outline: none; transition: all 0.2s;" />
    </div>
    
    <div id="error-box-step2" class="error-container" style="color: #e53e3e; font-size: 13px; margin-bottom: 12px; display: none; font-weight: 500; text-align: center;"></div>
    
    <!-- Minuteur et lien de renvoi -->
    <div class="timer-area" style="text-align: center; font-size: 14px; color: #718096; margin-bottom: 20px;">
      <span id="timer-text">Le code expire dans : <strong id="countdown">05:00</strong></span>
      <button type="button" id="resend-btn" style="display: none; background: none; border: none; color: #1F5C8B; font-weight: bold; cursor: pointer; text-decoration: underline; font-size: 14px;">Renvoyer le code</button>
    </div>
  </div>

  <button type="submit" id="verify-otp-btn" class="btn-primary">Vérifier le code</button>
</form>

<!-- Conteneur obligatoire masqué pour le reCAPTCHA invisible de Firebase -->
<div id="recaptcha-container"></div>

        <div class="secure-notice">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Pas de spam. Pas de mot de passe.
        </div>

      </div>
    </div>

  </div>

</body>
</html>
