<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study-IA - Connexion / Inscription</title>
  <style>
    /* Design System Global - Mobile First (Optimisé pour 360px) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #333333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo-area {
      margin-bottom: 40px;
    }

    .logo-area h1 {
      font-size: 28px;
      color: #1F5C8B;
      font-weight: bold;
    }

    .form-group {
      width: 100%;
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      color: #666666;
      margin-bottom: 8px;
    }

    /* Champ de saisie avec indicatif +237 fixe */
    .phone-input-wrapper {
      display: flex;
      align-items: center;
      border: 1px solid #cccccc;
      border-radius: 6px;
      padding: 0 12px;
      background-color: #fafafa;
      transition: border-color 0.2s;
    }

    .phone-input-wrapper:focus-within {
      border-color: #1F5C8B;
    }

    .country-code {
      font-size: 16px;
      color: #333333;
      font-weight: bold;
      margin-right: 8px;
      user-select: none;
    }

    .phone-input-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 14px 0;
      font-size: 16px;
      color: #333333;
      outline: none;
    }

    /* Message d'erreur dynamique */
    .error-message {
      color: #d9534f;
      font-size: 13px;
      margin-top: 6px;
      display: none;
    }

    /* Bouton d'action principal */
    .btn-submit {
      width: 100%;
      background-color: #1F5C8B;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #164366;
    }

    /* Texte de réassurance */
    .reassurance-text {
      margin-top: 24px;
      font-size: 13px;
      color: #888888;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <div class="logo-area">
      <h1>Study-IA</h1>
    </div>

    <form id="login-form-step1" style="width: 100%;">
      <div class="form-group">
        <label for="phone">Numéro de téléphone</label>
        <div class="phone-input-wrapper">
          <span class="country-code">+237</span>
          <input 
            type="tel" 
            id="phone" 
            placeholder="67xxxxxxx" 
            maxlength="9"
            autocomplete="tel"
          >
        </div>
        <div id="error-txt" class="error-message"></div>
      </div>

      <button type="submit" class="btn-submit">Recevoir mon code</button>
    </form>

    <p class="reassurance-text">
      Pas de spam. Pas de mot de passe.
    </p>

  </div>

  <script>
    document.getElementById('login-form-step1').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const phoneInput = document.getElementById('phone');
      const errorTxt = document.getElementById('error-txt');
      const rawValue = phoneInput.value.trim();

      // Regex pour le Cameroun : 9 chiffres au total, commençant obligatoirement par 6 (Mobile) ou 2 (Fixe)
      const cmPhoneRegex = /^(6|2)\d{8}$/;

      if (rawValue === "") {
        errorTxt.textContent = "Veuillez saisir votre numéro de téléphone.";
        errorTxt.style.display = "block";
        phoneInput.focus();
        return;
      }

      if (!cmPhoneRegex.test(rawValue)) {
        errorTxt.textContent = "Numéro invalide. Entrez les 9 chiffres (ex: 677xxxxxx).";
        errorTxt.style.display = "block";
        phoneInput.focus();
        return;
      }

      // Si le numéro est valide
      errorTxt.style.display = "none";
      
      // On reconstitue le numéro au format international E.164 pour Firebase
      const fullPhoneNumber = "+237" + rawValue;
      console.log("Numéro valide prêt pour Firebase :", fullPhoneNumber);

      // ICI : Tu pourras appeler ta fonction Firebase sendOTP(fullPhoneNumber)
      alert("Validation réussie ! Code envoyé au " + fullPhoneNumber);
    });

    // Efface le message d'erreur dès que l'utilisateur recommence à écrire
    document.getElementById('phone').addEventListener('input', function() {
      document.getElementById('error-txt').style.display = "none";
    });
  </script>

</body>
</html>
