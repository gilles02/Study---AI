<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study-IA — Connexion</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--ink);
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
    }

    .auth-logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo span { color: var(--gold); }

    /* ── Étape 1 : champ téléphone ── */
    #etape-telephone h2 {
      font-size: 1.3rem;
      margin-bottom: 6px;
    }
    #etape-telephone p {
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .phone-field {
      display: flex;
      align-items: center;
      background: var(--ink-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .phone-field:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(232,201,109,0.12);
    }

    .phone-prefix {
      padding: 12px 14px;
      font-size: 0.9rem;
      color: var(--text-muted);
      border-right: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      white-space: nowrap;
    }

    .phone-field input {
      border: none;
      background: transparent;
      box-shadow: none;
      flex: 1;
      padding: 12px 14px;
    }
    .phone-field input:focus {
      border: none;
      box-shadow: none;
    }

    /* ── Étape 2 : cases OTP ── */
    #etape-otp {
      display: none; /* caché au départ, affiché par JS */
    }

    #etape-otp h2 {
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    #numero-masque {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    /* Les 6 cases */
    .otp-grid {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
.otp-input {
  width: 48px;
  height: 56px;
  text-align: center;
  font-size: 1.4rem;
  font-weight: 700;
  font-family: var(--font-mono);
  background: var(--ink-soft);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  caret-color: var(--gold);
  transition: border-color 0.2s, box-shadow 0.2s;
  /* Ligne corrigée : on ajoute "appearance" sans préfixe */
  -moz-appearance: textfield;
  appearance: textfield;
}
.otp-input::-webkit-outer-spin-button,
.otp-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  appearance: none;
}
    .otp-input::-webkit-outer-spin-button,
    .otp-input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .otp-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(232,201,109,0.15);
      outline: none;
    }

    /* Case remplie → légère teinte */
    .otp-input:not(:placeholder-shown) {
      border-color: rgba(232,201,109,0.4);
      background: rgba(232,201,109,0.05);
    }

    /* Compte à rebours */
    #compte-rebours {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-family: var(--font-mono);
    }

    /* Bouton Renvoyer (caché par défaut) */
    #btn-renvoyer {
      display: none;
      width: 100%;
      margin-bottom: 12px;
    }

    /* Lien "Changer de numéro" */
    .link-changer {
      display: block;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 16px;
      cursor: pointer;
    }
    .link-changer:hover { color: var(--gold); }

    /* Zone message (erreur / succès / info) */
    #auth-message {
      display: none; /* affiché par JS quand nécessaire */
    }
  </style>
</head>
<body>

  <div class="auth-card">

    <div class="auth-logo">Study<span>-IA</span></div>

    <!-- ══════════════════════════════════════
         ÉTAPE 1 — Saisie du numéro
    ══════════════════════════════════════ -->
    <div id="etape-telephone">
      <h2>Connexion</h2>
      <p>Entre ton numéro pour recevoir un code par SMS.</p>

      <div class="form-group">
        <label for="phone-input">Numéro de téléphone</label>
        <div class="phone-field">
          <span class="phone-prefix">🇫🇷 +33</span>
          <!--
            id="phone-input" : lu par auth.js pour récupérer le numéro
            type="tel"       : affiche le clavier numérique sur mobile
          -->
          <input
            type="tel"
            id="phone-input"
            placeholder="6 12 34 56 78"
            autocomplete="tel"
          />
        </div>
      </div>

      <!--
        id="btn-envoyer-otp" : Firebase attache son reCAPTCHA invisible ici.
        NE PAS changer cet id sans le changer aussi dans auth.js (initRecaptcha).
      -->
      <button id="btn-envoyer-otp" class="btn btn-primary btn-full btn-lg">
        Recevoir mon code →
      </button>
    </div>


    <!-- ══════════════════════════════════════
         ÉTAPE 2 — Saisie du code OTP
         (display:none au départ, affiché par afficherEtapeOTP())
    ══════════════════════════════════════ -->
    <div id="etape-otp">
      <h2>Entre ton code</h2>
      <!--
        id="numero-masque" : auth.js écrit ici "Code envoyé au ••••••••78"
      -->
      <p id="numero-masque"></p>

      <!--
        6 cases indépendantes.
        class="otp-input" : sélectionnées en lot par querySelectorAll(".otp-input")
        type="number"     : clavier numérique sur mobile
        inputmode="numeric": force le clavier numérique sur iOS
        maxlength="1"     : bloque après 1 chiffre (le JS fait pareil en secours)
        placeholder="·"   : point visible quand vide
      -->
      <div class="otp-grid">
        <input class="otp-input" type="number" inputmode="numeric" maxlength="1" placeholder="·" />
        <input class="otp-input" type="number" inputmode="numeric" maxlength="1" placeholder="·" />
        <input class="otp-input" type="number" inputmode="numeric" maxlength="1" placeholder="·" />
        <input class="otp-input" type="number" inputmode="numeric" maxlength="1" placeholder="·" />
        <input class="otp-input" type="number" inputmode="numeric" maxlength="1" placeholder="·" />
        <input class="otp-input" type="number" inputmode="numeric" maxlength="1" placeholder="·" />
      </div>

      <!--
        id="compte-rebours" : auth.js met à jour ce texte toutes les secondes
        Ex : "Expire dans 4:32"
      -->
      <div id="compte-rebours">Expire dans 5:00</div>

      <!--
        id="btn-renvoyer" : caché par défaut, affiché quand le code expire
        ou après 3 mauvaises tentatives
      -->
      <button id="btn-renvoyer" class="btn btn-outline btn-full">
        ↺ Renvoyer le code
      </button>

      <!--
        id="btn-valider-otp" : déclenche validerCode() dans auth.js
        La validation se fait aussi automatiquement dès que les 6 cases sont remplies.
      -->
      <button id="btn-valider-otp" class="btn btn-primary btn-full btn-lg">
        Vérifier →
      </button>

      <!--
        id="btn-changer-numero" : retour à l'étape 1 sans recharger la page
      -->
      <span id="btn-changer-numero" class="link-changer">
        ← Changer de numéro
      </span>
    </div>


    <!-- ══════════════════════════════════════
         ZONE MESSAGE
         Affichée / cachée et colorée par auth.js
         selon que c'est une erreur, un warning ou un succès
    ══════════════════════════════════════ -->
    <div id="auth-message"></div>

  </div><!-- fin .auth-card -->


  <!--
    main.js : utilitaires partagés (sans import Firebase, pas de type="module")
    auth.js : type="module" OBLIGATOIRE car il contient des "import"
  -->
  <script src="js/main.js"></script>
  <script type="module" src="js/auth.js"></script>

</body>
</html>s
